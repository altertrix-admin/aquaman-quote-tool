<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Aquaman Services — Quote Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#01033E;
    --indigo:#0033FF;
    --white:#FFFFFF;
    --gray-900:#1A1B2E;
    --gray-600:#5B5D74;
    --gray-400:#8B8DA3;
    --gray-200:#E4E5EE;
    --gray-100:#F3F4F8;
    --red:#D33;
    --green:#0A8A4C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
    background:var(--gray-100);
    color:var(--gray-900);
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  #app-shell{max-width:480px;margin:0 auto;background:var(--white);min-height:100vh;box-shadow:0 0 40px rgba(1,3,62,0.06);}

  /* header */
  header{background:var(--navy);color:var(--white);padding:22px 20px 26px;position:relative;overflow:hidden;}
  header .brand{font-weight:800;font-size:15px;letter-spacing:0.06em;}
  header .sub{font-weight:500;font-size:12px;color:#AEB3E8;margin-top:2px;letter-spacing:0.03em;}
  .trajectory{height:6px;position:relative;background:var(--navy);}
  .trajectory svg{display:block;width:100%;height:100%;}

  /* section cards */
  main{padding:16px;}
  .card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-600);margin:0 0 12px;}
  .card h2 .accent{color:var(--indigo);}

  /* pill selectors */
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{
    flex:1;min-width:70px;text-align:center;padding:10px 8px;border-radius:8px;border:1.5px solid var(--gray-200);
    font-weight:700;font-size:13px;color:var(--gray-600);background:var(--white);cursor:pointer;transition:.12s;
  }
  .pill.active{background:var(--indigo);border-color:var(--indigo);color:var(--white);}
  .pill:active{transform:scale(0.97);}

  .tabs{display:flex;gap:6px;background:var(--gray-100);padding:4px;border-radius:10px;}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:7px;font-weight:700;font-size:12.5px;color:var(--gray-600);cursor:pointer;}
  .tab.active{background:var(--navy);color:var(--white);}

  label{display:block;font-size:12px;font-weight:700;color:var(--gray-600);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:14.5px;
    font-family:inherit;color:var(--gray-900);background:var(--white);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo);}
  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B5D74' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:34px;}

  .addon-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);gap:10px;}
  .addon-row:last-child{border-bottom:none;}
  .addon-label{font-size:13.5px;font-weight:600;flex:1;}
  .addon-price{font-size:13px;font-weight:700;color:var(--gray-600);white-space:nowrap;}
  .checkbox-wrap{display:flex;align-items:center;gap:9px;}
  input[type=checkbox],input[type=radio]{width:19px;height:19px;accent-color:var(--indigo);flex-shrink:0;}

  .radio-group{display:flex;gap:8px;margin-top:6px;}
  .radio-opt{flex:1;border:1.5px solid var(--gray-200);border-radius:8px;padding:9px;display:flex;align-items:center;gap:7px;cursor:pointer;}
  .radio-opt.selected{border-color:var(--indigo);background:#EEF1FF;}
  .radio-opt span{font-size:12.5px;font-weight:600;}

  .subgroup{background:var(--gray-100);border-radius:8px;padding:10px 12px;margin-top:8px;}
  .subgroup .subtitle{font-size:11.5px;font-weight:800;color:var(--gray-600);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}

  /* vehicle cards (fleet) */
  .vehicle-card{border:1.5px solid var(--gray-200);border-radius:9px;padding:12px;margin-bottom:10px;position:relative;}
  .vehicle-card.approved{border-color:var(--green);background:#F2FBF6;}
  .vehicle-card .vtitle{font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;}
  .badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.04em;}
  .badge.approved{background:var(--green);color:var(--white);}
  .badge.draft{background:var(--gray-200);color:var(--gray-600);}
  .vehicle-meta{font-size:12px;color:var(--gray-600);margin-top:3px;}
  .vcard-actions{display:flex;gap:8px;margin-top:10px;}

  button{font-family:inherit;cursor:pointer;border:none;}
  .btn{padding:12px 14px;border-radius:8px;font-weight:700;font-size:13.5px;}
  .btn-primary{background:var(--indigo);color:var(--white);width:100%;}
  .btn-secondary{background:var(--white);color:var(--navy);border:1.5px solid var(--navy);}
  .btn-outline{background:var(--white);color:var(--gray-600);border:1.5px solid var(--gray-200);}
  .btn-danger-outline{background:var(--white);color:var(--red);border:1.5px solid #F3C7C7;}
  .btn-sm{padding:8px 10px;font-size:12px;flex:1;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .fleet-progress{display:flex;align-items:center;justify-content:space-between;background:var(--gray-100);border-radius:8px;padding:12px;margin-bottom:12px;}
  .fleet-progress .count{font-size:22px;font-weight:800;color:var(--navy);}
  .fleet-progress .count small{font-size:12px;font-weight:600;color:var(--gray-600);}
  .warn-banner{background:#FFF6E5;border:1px solid #F4D999;color:#8A6200;font-size:12px;font-weight:600;padding:10px 12px;border-radius:8px;margin-bottom:12px;line-height:1.4;}
  .info-banner{background:#EEF1FF;border:1px solid #C9D1FF;color:var(--navy);font-size:12px;font-weight:600;padding:10px 12px;border-radius:8px;margin-bottom:12px;line-height:1.4;}

  .totals-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;}
  .totals-row.total{border-top:1.5px solid var(--gray-200);margin-top:6px;padding-top:10px;font-size:17px;font-weight:800;color:var(--navy);}
  .totals-row .label{color:var(--gray-600);font-weight:600;}
  .totals-row.total .label{color:var(--navy);}

  .exempt-note{font-size:11.5px;color:var(--gray-600);margin-top:6px;line-height:1.4;}

  .footer-actions{position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--gray-200);padding:12px 16px;display:flex;gap:8px;max-width:480px;margin:0 auto;}

  .saved-item{padding:10px 0;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .saved-item:last-child{border-bottom:none;}
  .saved-item .si-name{font-weight:700;font-size:13.5px;}
  .saved-item .si-meta{font-size:11.5px;color:var(--gray-600);margin-top:2px;}
  .saved-item .si-total{font-weight:800;color:var(--navy);font-size:14px;}

  .empty-state{text-align:center;padding:20px 10px;color:var(--gray-400);font-size:13px;font-weight:600;}

  /* print preview (hidden on screen) */
  #print-area{display:none;}

  @media print{
    body *{visibility:hidden;}
    #print-area,#print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;top:0;left:0;width:100%;padding:0;margin:0;}
    #app-shell,.footer-actions{display:none;}
  }

  .pv-header{background:var(--navy);color:var(--white);padding:26px 30px;position:relative;}
  .pv-header .pv-tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .pv-header h1{font-size:24px;margin:6px 0 2px;font-weight:800;}
  .pv-header .pv-sub{font-size:12px;color:#AEB3E8;font-weight:500;}
  .pv-diag{height:4px;background:var(--indigo);}
  .pv-body{padding:24px 30px;}
  .pv-cols{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px;}
  .pv-col h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-600);margin:0 0 6px;}
  .pv-col p{margin:0;font-size:13px;line-height:1.5;}
  table.pv-table{width:100%;border-collapse:collapse;margin-top:10px;}
  table.pv-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-600);padding:8px 0;border-bottom:1.5px solid var(--gray-200);}
  table.pv-table td{padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:13px;vertical-align:top;}
  table.pv-table td.amt{text-align:right;font-weight:700;white-space:nowrap;}
  .pv-summary{margin-top:16px;padding-top:12px;border-top:1.5px solid var(--gray-200);}
  .pv-summary .row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;}
  .pv-summary .row.total{font-size:18px;font-weight:800;color:var(--navy);border-top:1.5px solid var(--gray-200);margin-top:6px;padding-top:10px;}
  .pv-footnote{font-size:11px;color:var(--gray-600);margin-top:20px;line-height:1.5;}
</style>
</head>
<body>

<div id="app-shell">
  <header>
    <div class="brand">AQUAMAN SERVICES</div>
    <div class="sub">Quote Tool — Internal Use</div>
  </header>
  <div class="trajectory">
    <svg viewBox="0 0 480 6" preserveAspectRatio="none"><polyline points="0,5 360,5 380,1 480,1" fill="none" stroke="#0033FF" stroke-width="3"/></svg>
  </div>

  <main id="main-content"></main>

  <div class="footer-actions">
    <button class="btn btn-outline btn-sm" id="btn-save">Save</button>
    <button class="btn btn-secondary btn-sm" id="btn-print">Print / PDF</button>
    <button class="btn btn-primary btn-sm" id="btn-email">Email</button>
  </div>
</div>

<div id="print-area"></div>

<script>
/* ============ PRICING DATA ============ */
const VEHICLE_TYPES = ['Sedan','SUV','Regular Truck','Big Truck'];

const INDIVIDUAL_SERVICES = {
  'Super Wash Package': [130,150,170,190],
  'Interior Only': [80,100,100,120],
  'Exterior Only': [70,80,100,120],
};

const FLEET_SERVICES = {
  'Fleet Detail': [100,120,140,170],
  'Interior Only': [55,65,75,85],
  'Exterior Only': [45,55,65,75],
};

const ADDONS = {
  carpet_wash:   {label:'Carpet Shampoo Clean — Wash', prices:[78,85,98,115], group:'carpet'},
  carpet_decon:  {label:'Carpet Shampoo Clean — Decontamination', prices:[39,45,55,65], group:'carpet'},
  fabric_wash:   {label:'Fabric Seat Shampoo Clean — Wash', prices:[78,88,98,108], group:'fabric'},
  fabric_decon:  {label:'Fabric Seat Shampoo Clean — Decontamination', prices:[40,50,60,70], group:'fabric'},
  steam_decon:   {label:'Steam Decontamination', prices:[19,28,38,48]},
  ozone:         {label:'Ozone Odor Treatment', prices:[39,49,59,69]},
  headliner:     {label:'Headliner Cleaning', prices:[40,50,60,70]},
  leather:       {label:'Leather Treatment & Conditioner', prices:[40,48,58,68]},
  pet_hair:      {label:'Pet Hair Removal', prices:[25,35,45,55]},
  engine_bay:    {label:'Engine Bay Wash', prices:[50,60,70,100]},
  clay_bar:      {label:'Clay Bar Treatment', prices:[50,60,70,80]},
  tree_sap:      {label:'Tree Sap Removal', prices:[50,60,70,80]},
};
const FLEET_ADDON_DISCOUNT = 10;
const FLEET_MIN_VEHICLES = 5;
const AUTHOR_DISPLAY = {Jose:'José', Juan:'Juan'};

/* ============ STATE ============ */
let state = {
  createdBy: '',
  quoteType: 'individual', // individual | fleet | boat
  customer: {name:'', contact:'', address:''},
  individual: {vehicleType:0, service:'Super Wash Package', addons:{}},
  fleet: {vehicles: [], override:{active:false, name:'', reason:''}},
  tax: {rate:'', exempt:false},
  discount: 0,
  activeVehicleDraft: null, // vehicle being built before adding to list
};
let savedQuotes = [];
let editingSavedId = null;

/* ============ STORAGE ============ */
async function loadSavedQuotes(){
  try{
    const res = await window.storage.get('aquaman-quotes', true);
    savedQuotes = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ savedQuotes = []; }
}
async function persistSavedQuotes(){
  try{ await window.storage.set('aquaman-quotes', JSON.stringify(savedQuotes), true); }
  catch(e){ console.error('Storage error', e); alert('Could not save. Please try again.'); }
}

/* ============ HELPERS ============ */
function money(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
function newId(){ return 'v' + Math.random().toString(36).slice(2,9); }

function emptyVehicleDraft(){
  return {id:newId(), type:0, service:'Fleet Detail', addons:{}, approved:false};
}

/* ============ CALCULATIONS ============ */
function calcIndividualLines(){
  const lines = [];
  const vt = state.individual.vehicleType;
  const svc = state.individual.service;
  if(svc === 'Boat Wash'){
    return {lines:[{label:'Boat Wash', vehicle:'—', amount:null, note:'Contact us for availability'}], subtotal:0};
  }
  lines.push({label: svc, vehicle: VEHICLE_TYPES[vt], amount: INDIVIDUAL_SERVICES[svc][vt]});
  Object.keys(state.individual.addons).forEach(key=>{
    if(state.individual.addons[key]){
      const a = ADDONS[key];
      lines.push({label:a.label, vehicle:VEHICLE_TYPES[vt], amount:a.prices[vt]});
    }
  });
  const subtotal = lines.reduce((s,l)=> s + (l.amount||0), 0);
  return {lines, subtotal};
}

function calcFleetLines(){
  const approved = state.fleet.vehicles.filter(v=>v.approved);
  let lines = [];
  let fleetDiscount = 0;
  approved.forEach((v,idx)=>{
    lines.push({label: v.service, vehicle: VEHICLE_TYPES[v.type] + ' #' + (idx+1), amount: FLEET_SERVICES[v.service][v.type]});
    Object.keys(v.addons).forEach(key=>{
      if(v.addons[key]){
        const a = ADDONS[key];
        const full = a.prices[v.type];
        lines.push({label: a.label, vehicle: VEHICLE_TYPES[v.type] + ' #' + (idx+1), amount: full});
        fleetDiscount += FLEET_ADDON_DISCOUNT;
      }
    });
  });
  const rawSubtotal = lines.reduce((s,l)=> s + (l.amount||0), 0);
  return {lines, approvedCount:approved.length, totalCount:state.fleet.vehicles.length, fleetDiscount, subtotal: rawSubtotal - fleetDiscount};
}

function calcTotals(){
  let base;
  if(state.quoteType === 'individual') base = calcIndividualLines();
  else if(state.quoteType === 'fleet') base = calcFleetLines();
  else base = {lines:[{label:'Boat Wash', vehicle:'—', amount:null, note:'Contact us for availability'}], subtotal:0, fleetDiscount:0};

  const subtotal = base.subtotal || 0;
  const discount = Number(state.discount) || 0;
  const afterDiscount = Math.max(0, subtotal - discount);
  const rate = state.tax.exempt ? 0 : (Number(state.tax.rate) || 0);
  const tax = afterDiscount * (rate/100);
  const total = afterDiscount + tax;
  return {...base, subtotal, discount, tax, taxRate:rate, total};
}

/* ============ RENDER: MAIN APP ============ */
function render(){
  const m = document.getElementById('main-content');
  m.innerHTML = `
    ${renderCreatedBy()}
    ${renderQuoteTypeTabs()}
    ${renderCustomerCard()}
    ${state.quoteType==='individual' ? renderIndividualCard() : ''}
    ${state.quoteType==='fleet' ? renderFleetCard() : ''}
    ${state.quoteType==='boat' ? renderBoatCard() : ''}
    ${state.quoteType!=='boat' ? renderTaxCard() : ''}
    ${renderTotalsCard()}
    ${renderSavedQuotesCard()}
  `;
  attachHandlers();
}

function renderCreatedBy(){
  return `
  <div class="card">
    <h2>Quote created by</h2>
    <div class="pill-row">
      <div class="pill ${state.createdBy==='Jose'?'active':''}" data-action="set-author" data-value="Jose">José</div>
      <div class="pill ${state.createdBy==='Juan'?'active':''}" data-action="set-author" data-value="Juan">Juan</div>
    </div>
  </div>`;
}

function renderQuoteTypeTabs(){
  return `
  <div class="card">
    <h2>Quote Type</h2>
    <div class="tabs">
      <div class="tab ${state.quoteType==='individual'?'active':''}" data-action="set-type" data-value="individual">Individual</div>
      <div class="tab ${state.quoteType==='fleet'?'active':''}" data-action="set-type" data-value="fleet">Fleet (5+)</div>
      <div class="tab ${state.quoteType==='boat'?'active':''}" data-action="set-type" data-value="boat">Boat Wash</div>
    </div>
  </div>`;
}

function renderCustomerCard(){
  return `
  <div class="card">
    <h2>Customer</h2>
    <label>Customer / Company Name</label>
    <input type="text" id="cust-name" value="${esc(state.customer.name)}" placeholder="e.g. John Smith">
    <label>Phone or Email</label>
    <input type="text" id="cust-contact" value="${esc(state.customer.contact)}" placeholder="e.g. (901) 555-0100">
    <label>Service Address (optional)</label>
    <input type="text" id="cust-address" value="${esc(state.customer.address)}" placeholder="Street, City, State">
  </div>`;
}

function addonRow(key, currentAddons, vt, radioGroupSelected){
  const a = ADDONS[key];
  if(a.group) return ''; // handled separately in radio groups
  const checked = !!currentAddons[key];
  return `
  <div class="addon-row">
    <div class="checkbox-wrap">
      <input type="checkbox" data-action="toggle-addon" data-key="${key}" ${checked?'checked':''}>
      <span class="addon-label">${a.label}</span>
    </div>
    <span class="addon-price">${money(a.prices[vt])}</span>
  </div>`;
}

function radioGroupHtml(group, currentAddons, vt, labelTitle){
  const washKey = group+'_wash', deconKey = group+'_decon';
  const selected = currentAddons[washKey] ? 'wash' : (currentAddons[deconKey] ? 'decon' : null);
  return `
  <div class="subgroup">
    <div class="subtitle">${labelTitle} — choose one</div>
    <div class="radio-group">
      <div class="radio-opt ${selected==='wash'?'selected':''}" data-action="set-radio-addon" data-group="${group}" data-value="wash">
        <input type="radio" ${selected==='wash'?'checked':''}>
        <span>Wash — ${money(ADDONS[washKey].prices[vt])}</span>
      </div>
      <div class="radio-opt ${selected==='decon'?'selected':''}" data-action="set-radio-addon" data-group="${group}" data-value="decon">
        <input type="radio" ${selected==='decon'?'checked':''}>
        <span>Decon — ${money(ADDONS[deconKey].prices[vt])}</span>
      </div>
    </div>
  </div>`;
}

function renderAddonsBlock(currentAddons, vt, idPrefix){
  const singleKeys = Object.keys(ADDONS).filter(k=>!ADDONS[k].group);
  return `
    ${radioGroupHtml('carpet', currentAddons, vt, 'Carpet')}
    ${radioGroupHtml('fabric', currentAddons, vt, 'Fabric Seats')}
    <div style="margin-top:8px;">
      ${singleKeys.map(k=>addonRow(k, currentAddons, vt)).join('')}
    </div>
  `;
}

function renderIndividualCard(){
  const {vehicleType, service, addons} = state.individual;
  return `
  <div class="card">
    <h2>Service Details</h2>
    <label>Vehicle Type</label>
    <select id="ind-vtype">
      ${VEHICLE_TYPES.map((v,i)=>`<option value="${i}" ${i==vehicleType?'selected':''}>${v}</option>`).join('')}
    </select>
    <label>Package</label>
    <select id="ind-service">
      ${Object.keys(INDIVIDUAL_SERVICES).map(s=>`<option value="${s}" ${s===service?'selected':''}>${s} — ${money(INDIVIDUAL_SERVICES[s][vehicleType])}</option>`).join('')}
    </select>
    <label style="margin-top:16px;">Add-Ons</label>
    ${renderAddonsBlock(addons, vehicleType)}
  </div>`;
}

function renderBoatCard(){
  return `
  <div class="card">
    <h2>Boat Wash</h2>
    <div class="info-banner">Boat Wash pricing is not published yet. This quote will show "Contact us for availability" — do not enter or promise a price.</div>
  </div>`;
}

function renderFleetVehicleForm(){
  const d = state.activeVehicleDraft;
  if(!d) return '';
  return `
  <div class="vehicle-card" style="border-color:var(--indigo);background:#F7F8FF;">
    <div class="vtitle">New Vehicle</div>
    <label>Vehicle Type</label>
    <select id="fv-type">
      ${VEHICLE_TYPES.map((v,i)=>`<option value="${i}" ${i==d.type?'selected':''}>${v}</option>`).join('')}
    </select>
    <label>Service</label>
    <select id="fv-service">
      ${Object.keys(FLEET_SERVICES).map(s=>`<option value="${s}" ${s===d.service?'selected':''}>${s} — ${money(FLEET_SERVICES[s][d.type])}</option>`).join('')}
    </select>
    <label style="margin-top:14px;">Add-Ons for this vehicle</label>
    ${renderAddonsBlock(d.addons, d.type)}
    <div class="vcard-actions">
      <button class="btn btn-outline btn-sm" data-action="cancel-vehicle-draft">Cancel</button>
      <button class="btn btn-primary btn-sm" data-action="confirm-vehicle-draft">Add & Approve Vehicle</button>
    </div>
  </div>`;
}

function renderFleetCard(){
  const approvedCount = state.fleet.vehicles.filter(v=>v.approved).length;
  const totalCount = state.fleet.vehicles.length;
  const belowMin = approvedCount < FLEET_MIN_VEHICLES;
  const ov = state.fleet.override;

  const vehicleItems = state.fleet.vehicles.map((v,idx)=>`
    <div class="vehicle-card ${v.approved?'approved':''}">
      <div class="vtitle">
        <span>${VEHICLE_TYPES[v.type]} #${idx+1} — ${v.service}</span>
        <span class="badge ${v.approved?'approved':'draft'}">${v.approved?'APPROVED':'DRAFT'}</span>
      </div>
      <div class="vehicle-meta">${money(FLEET_SERVICES[v.service][v.type])} base ${Object.keys(v.addons).filter(k=>v.addons[k]).length ? '+ ' + Object.keys(v.addons).filter(k=>v.addons[k]).length + ' add-on(s)' : ''}</div>
      <div class="vcard-actions">
        ${!v.approved ? `<button class="btn btn-outline btn-sm" data-action="approve-vehicle" data-id="${v.id}">Approve</button>` : ''}
        <button class="btn btn-danger-outline btn-sm" data-action="remove-vehicle" data-id="${v.id}">Remove</button>
      </div>
    </div>
  `).join('');

  return `
  <div class="card">
    <h2>Fleet Vehicles</h2>
    <div class="fleet-progress">
      <div class="count">${approvedCount}<small> / ${FLEET_MIN_VEHICLES} approved</small></div>
      <div style="font-size:12px;color:var(--gray-600);font-weight:600;">${totalCount} total added</div>
    </div>
    ${belowMin && !ov.active ? `<div class="warn-banner">Below ${FLEET_MIN_VEHICLES} approved vehicles: this quote stays a <b>draft</b>. Print, Email and marking as Sent are disabled until ${FLEET_MIN_VEHICLES} vehicles are approved, or Owner Override is used below.</div>` : ''}
    ${belowMin && ov.active ? `<div class="warn-banner">Owner Override active — ${ov.name || '(no name entered)'}: "${ov.reason || '(no reason entered)'}". This is a simplified override with no real authentication. Full security arrives with Step 1 of the build plan.</div>` : ''}

    ${vehicleItems || '<div class="empty-state">No vehicles added yet.</div>'}
    ${renderFleetVehicleForm()}
    ${!state.activeVehicleDraft ? `<button class="btn btn-secondary" style="width:100%;margin-top:6px;" data-action="start-vehicle-draft">+ Add Vehicle</button>` : ''}
  </div>

  ${belowMin ? `
  <div class="card">
    <h2>Owner Override <span class="accent">(temporary, no real login)</span></h2>
    <div class="checkbox-wrap" style="margin-bottom:10px;">
      <input type="checkbox" id="ov-active" ${ov.active?'checked':''}>
      <span style="font-size:13px;font-weight:600;">Enable override to quote fewer than ${FLEET_MIN_VEHICLES} vehicles as fleet</span>
    </div>
    ${ov.active ? `
      <label>Authorized by (José or Juan)</label>
      <input type="text" id="ov-name" value="${esc(ov.name)}" placeholder="Name">
      <label>Reason</label>
      <textarea id="ov-reason" rows="2" placeholder="Why this fleet quote needs fewer than ${FLEET_MIN_VEHICLES} vehicles">${esc(ov.reason)}</textarea>
    ` : ''}
  </div>` : ''}
  `;
}

function renderTaxCard(){
  return `
  <div class="card">
    <h2>Tax</h2>
    <label>Sales Tax Rate (%)</label>
    <input type="number" id="tax-rate" step="0.01" min="0" value="${esc(state.tax.rate)}" placeholder="e.g. 9.75" ${state.tax.exempt?'disabled':''}>
    <div class="checkbox-wrap" style="margin-top:12px;">
      <input type="checkbox" id="tax-exempt" ${state.tax.exempt?'checked':''}>
      <span style="font-size:13px;font-weight:700;">Tax Exempt — Resale (dealer)</span>
    </div>
    ${state.tax.exempt ? `<div class="exempt-note">Only apply this if the dealer's resale certification (license # verified + resale confirmation) is signed and on file. Not automatic — you confirm this before sending.</div>` : ''}
    <label style="margin-top:14px;">Manual Discount ($)</label>
    <input type="number" id="manual-discount" step="0.01" min="0" value="${esc(state.discount)}" placeholder="0.00">
  </div>`;
}

function renderTotalsCard(){
  const t = calcTotals();
  if(state.quoteType==='boat'){
    return `<div class="card"><h2>Summary</h2><div class="info-banner">No pricing to calculate. Save or send this quote as a "Contact us for availability" note.</div></div>`;
  }
  return `
  <div class="card">
    <h2>Summary</h2>
    <div class="totals-row"><span class="label">Subtotal</span><span>${money(t.subtotal)}</span></div>
    ${state.quoteType==='fleet' && t.fleetDiscount ? `<div class="totals-row"><span class="label">Fleet Add-On Discount</span><span>-${money(t.fleetDiscount)}</span></div>` : ''}
    ${t.discount ? `<div class="totals-row"><span class="label">Discount</span><span>-${money(t.discount)}</span></div>` : ''}
    <div class="totals-row"><span class="label">Sales Tax ${state.tax.exempt?'(Exempt)':t.taxRate?'('+t.taxRate+'%)':''}</span><span>${money(t.tax)}</span></div>
    <div class="totals-row total"><span class="label">Total</span><span>${money(t.total)}</span></div>
  </div>`;
}

function renderSavedQuotesCard(){
  const items = savedQuotes.slice().reverse().map(q=>`
    <div class="saved-item" data-action="open-saved" data-id="${q.id}">
      <div>
        <div class="si-name">${esc(q.customer.name || 'Unnamed customer')}</div>
        <div class="si-meta">${q.quoteType} · by ${AUTHOR_DISPLAY[q.createdBy]||q.createdBy || '—'} · ${new Date(q.savedAt).toLocaleDateString()}</div>
      </div>
      <div class="si-total">${q.quoteType==='boat' ? '—' : money(q.total)}</div>
    </div>
  `).join('');
  return `
  <div class="card">
    <h2>Saved Quotes <span class="accent">(shared)</span></h2>
    ${items || '<div class="empty-state">No saved quotes yet.</div>'}
  </div>`;
}

function esc(s){ return String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ============ EVENT HANDLING ============ */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  const bind = (id, evt, fn) => { const el = document.getElementById(id); if(el) el.addEventListener(evt, fn); };
  bind('cust-name','input', e=>{ state.customer.name = e.target.value; });
  bind('cust-contact','input', e=>{ state.customer.contact = e.target.value; });
  bind('cust-address','input', e=>{ state.customer.address = e.target.value; });
  bind('ind-vtype','change', e=>{ state.individual.vehicleType = Number(e.target.value); render(); });
  bind('ind-service','change', e=>{ state.individual.service = e.target.value; render(); });
  bind('fv-type','change', e=>{ state.activeVehicleDraft.type = Number(e.target.value); render(); });
  bind('fv-service','change', e=>{ state.activeVehicleDraft.service = e.target.value; render(); });
  bind('tax-rate','input', e=>{ state.tax.rate = e.target.value; render(); });
  bind('tax-exempt','change', e=>{ state.tax.exempt = e.target.checked; render(); });
  bind('manual-discount','input', e=>{ state.discount = e.target.value; render(); });
  bind('ov-active','change', e=>{ state.fleet.override.active = e.target.checked; render(); });
  bind('ov-name','input', e=>{ state.fleet.override.name = e.target.value; });
  bind('ov-name','blur', ()=>{ render(); });
  bind('ov-reason','input', e=>{ state.fleet.override.reason = e.target.value; });
  bind('ov-reason','blur', ()=>{ render(); });

  document.querySelectorAll('[data-action="toggle-addon"]').forEach(el=>{
    el.addEventListener('change', e=>{
      const key = e.target.getAttribute('data-key');
      const target = state.activeVehicleDraft ? state.activeVehicleDraft.addons : state.individual.addons;
      target[key] = e.target.checked;
      render();
    });
  });
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.getAttribute('data-action');
  if(action === 'set-author'){ state.createdBy = el.getAttribute('data-value'); render(); }
  else if(action === 'set-type'){ state.quoteType = el.getAttribute('data-value'); render(); }
  else if(action === 'set-radio-addon'){
    const group = el.getAttribute('data-group');
    const value = el.getAttribute('data-value');
    const target = state.activeVehicleDraft ? state.activeVehicleDraft.addons : state.individual.addons;
    target[group+'_wash'] = false;
    target[group+'_decon'] = false;
    target[group+'_'+value] = true;
    render();
  }
  else if(action === 'start-vehicle-draft'){ state.activeVehicleDraft = emptyVehicleDraft(); render(); }
  else if(action === 'cancel-vehicle-draft'){ state.activeVehicleDraft = null; render(); }
  else if(action === 'confirm-vehicle-draft'){
    const d = state.activeVehicleDraft;
    d.approved = true;
    state.fleet.vehicles.push(d);
    state.activeVehicleDraft = null;
    render();
  }
  else if(action === 'approve-vehicle'){
    const id = el.getAttribute('data-id');
    const v = state.fleet.vehicles.find(v=>v.id===id);
    if(v) v.approved = true;
    render();
  }
  else if(action === 'remove-vehicle'){
    const id = el.getAttribute('data-id');
    state.fleet.vehicles = state.fleet.vehicles.filter(v=>v.id!==id);
    render();
  }
  else if(action === 'open-saved'){
    const id = el.getAttribute('data-id');
    const q = savedQuotes.find(q=>q.id===id);
    if(q && confirm('Load this saved quote? Unsaved changes to the current quote will be lost.')){
      state = JSON.parse(JSON.stringify(q.state));
      editingSavedId = q.id;
      render();
    }
  }
}

/* ============ VALIDATION ============ */
function canFinalize(){
  if(state.quoteType === 'boat') return true;
  if(state.quoteType === 'individual') return true;
  if(state.quoteType === 'fleet'){
    const approvedCount = state.fleet.vehicles.filter(v=>v.approved).length;
    if(approvedCount >= FLEET_MIN_VEHICLES) return true;
    if(state.fleet.override.active && state.fleet.override.name.trim() && state.fleet.override.reason.trim()) return true;
    return false;
  }
  return true;
}

/* ============ SAVE ============ */
async function handleSave(){
  if(!state.createdBy){ alert('Please select who created this quote (José or Juan) before saving.'); return; }
  const t = calcTotals();
  const record = {
    id: editingSavedId || newId(),
    createdBy: state.createdBy,
    quoteType: state.quoteType,
    customer: state.customer,
    total: t.total,
    savedAt: new Date().toISOString(),
    state: JSON.parse(JSON.stringify(state)),
  };
  const idx = savedQuotes.findIndex(q=>q.id===record.id);
  if(idx>=0) savedQuotes[idx] = record; else savedQuotes.push(record);
  await persistSavedQuotes();
  editingSavedId = record.id;
  render();
  alert('Quote saved.');
}

/* ============ PRINT PREVIEW ============ */
function buildPreviewHTML(){
  const t = calcTotals();
  const today = new Date().toLocaleDateString('en-US');
  const rows = (t.lines||[]).map(l=>`
    <tr>
      <td>${esc(l.label)}</td>
      <td>${esc(l.vehicle)}</td>
      <td class="amt">${l.amount!=null ? money(l.amount) : (l.note||'')}</td>
    </tr>
  `).join('');

  const summaryHtml = state.quoteType==='boat' ? '' : `
    <div class="pv-summary">
      <div class="row"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
      ${state.quoteType==='fleet' && t.fleetDiscount ? `<div class="row"><span>Fleet Add-On Discount</span><span>-${money(t.fleetDiscount)}</span></div>` : ''}
      ${t.discount ? `<div class="row"><span>Discount</span><span>-${money(t.discount)}</span></div>` : ''}
      <div class="row"><span>Sales Tax ${state.tax.exempt?'(Exempt — Resale)':''}</span><span>${money(t.tax)}</span></div>
      <div class="row total"><span>Total</span><span>${money(t.total)}</span></div>
    </div>
  `;

  return `
    <div class="pv-header">
      <div class="pv-tag">Estimate — Not an Invoice</div>
      <h1>Aquaman Services</h1>
      <div class="pv-sub">Professional detailing, down to the last detail.</div>
    </div>
    <div class="pv-diag"></div>
    <div class="pv-body">
      <div class="pv-cols">
        <div class="pv-col">
          <h3>Prepared For</h3>
          <p><b>${esc(state.customer.name||'—')}</b><br>${esc(state.customer.contact||'')}<br>${esc(state.customer.address||'')}</p>
        </div>
        <div class="pv-col" style="text-align:right;">
          <h3>Date</h3>
          <p>${today}</p>
          <h3 style="margin-top:12px;">Prepared By</h3>
          <p>${esc(AUTHOR_DISPLAY[state.createdBy]||state.createdBy||'—')} · Aquaman Services</p>
        </div>
      </div>
      ${state.quoteType==='boat' ? `<p style="font-size:14px;">Boat Wash — <b>Contact us for availability.</b> Pricing provided upon request.</p>` : `
      <table class="pv-table">
        <tr><th>Service / Add-On</th><th>Vehicle</th><th style="text-align:right;">Amount</th></tr>
        ${rows}
      </table>
      ${summaryHtml}
      `}
      <div class="pv-footnote">
        Appointments are confirmed based on availability. Submitting or receiving this estimate does not reserve an appointment.<br>
        (901) 340-9733 · aquamanservicesllc.com
      </div>
    </div>
  `;
}

function handlePrint(){
  if(!state.createdBy){ alert('Please select who created this quote (José or Juan) first.'); return; }
  if(!canFinalize()){ alert('This fleet quote has fewer than '+FLEET_MIN_VEHICLES+' approved vehicles. Enable and complete Owner Override, or approve more vehicles, before printing.'); return; }
  document.getElementById('print-area').innerHTML = buildPreviewHTML();
  window.print();
}

/* ============ EMAIL ============ */
function buildMailto(){
  const t = calcTotals();
  const subject = 'Aquaman Services — Estimate for ' + (state.customer.name || 'Customer');
  let body = 'ESTIMATE — Not an Invoice\nAquaman Services\nProfessional detailing, down to the last detail.\n\n';
  body += 'Prepared for: ' + (state.customer.name||'—') + '\n';
  body += 'Contact: ' + (state.customer.contact||'—') + '\n\n';
  if(state.quoteType==='boat'){
    body += 'Boat Wash — Contact us for availability.\n';
  } else {
    (t.lines||[]).forEach(l=>{
      body += '- ' + l.label + ' (' + l.vehicle + '): ' + (l.amount!=null?money(l.amount):(l.note||'')) + '\n';
    });
    body += '\nSubtotal: ' + money(t.subtotal) + '\n';
    if(state.quoteType==='fleet' && t.fleetDiscount) body += 'Fleet Add-On Discount: -' + money(t.fleetDiscount) + '\n';
    if(t.discount) body += 'Discount: -' + money(t.discount) + '\n';
    body += 'Sales Tax' + (state.tax.exempt?' (Exempt — Resale)':'') + ': ' + money(t.tax) + '\n';
    body += 'TOTAL: ' + money(t.total) + '\n';
  }
  body += '\nAppointments are confirmed based on availability. This estimate does not reserve an appointment.\n';
  body += '(901) 340-9733 · aquamanservicesllc.com';
  return 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}

function handleEmail(){
  if(!state.createdBy){ alert('Please select who created this quote (José or Juan) first.'); return; }
  if(!canFinalize()){ alert('This fleet quote has fewer than '+FLEET_MIN_VEHICLES+' approved vehicles. Enable and complete Owner Override, or approve more vehicles, before emailing.'); return; }
  window.location.href = buildMailto();
}

/* ============ INIT ============ */
document.getElementById('btn-save').addEventListener('click', handleSave);
document.getElementById('btn-print').addEventListener('click', handlePrint);
document.getElementById('btn-email').addEventListener('click', handleEmail);

(async function init(){
  await loadSavedQuotes();
  render();
})();
</script>
