<style>
  :root{
    --navy:#01033E; --indigo:#0033FF; --white:#FFFFFF;
    --gray-900:#1A1B2E; --gray-600:#5B5D74; --gray-400:#8B8DA3;
    --gray-200:#E4E5EE; --gray-100:#F3F4F8; --red:#D33; --green:#0A8A4C; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--gray-100);color:var(--gray-900);-webkit-font-smoothing:antialiased;padding-bottom:60px;}
  #app-shell{max-width:480px;margin:0 auto;background:var(--white);min-height:100vh;box-shadow:0 0 40px rgba(1,3,62,0.06);}

  header{background:var(--navy);color:var(--white);padding:16px 20px 20px;position:relative;}
  header .top-row{display:flex;justify-content:space-between;align-items:flex-start;}
  header .brand{font-weight:800;font-size:15px;letter-spacing:0.06em;}
  header .sub{font-weight:500;font-size:12px;color:#AEB3E8;margin-top:2px;letter-spacing:0.03em;}
  .lang-toggle{display:flex;background:rgba(255,255,255,0.12);border-radius:8px;padding:3px;}
  .lang-btn{padding:6px 10px;font-size:11.5px;font-weight:800;color:#AEB3E8;border-radius:6px;cursor:pointer;}
  .lang-btn.active{background:var(--indigo);color:var(--white);}

  .trajectory{height:6px;position:relative;background:var(--navy);}
  .trajectory svg{display:block;width:100%;height:100%;}

  main{padding:16px;}
  .card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-600);margin:0 0 12px;}
  .card h2 .accent{color:var(--indigo);}

  .pill-row{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{flex:1;min-width:70px;text-align:center;padding:10px 8px;border-radius:8px;border:1.5px solid var(--gray-200);font-weight:700;font-size:13px;color:var(--gray-600);background:var(--white);cursor:pointer;transition:.12s;}
  .pill.active{background:var(--indigo);border-color:var(--indigo);color:var(--white);}
  .pill:active{transform:scale(0.97);}

  .tabs{display:flex;gap:6px;background:var(--gray-100);padding:4px;border-radius:10px;}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:7px;font-weight:700;font-size:12.5px;color:var(--gray-600);cursor:pointer;}
  .tab.active{background:var(--navy);color:var(--white);}

  label{display:block;font-size:12px;font-weight:700;color:var(--gray-600);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:14.5px;
    font-family:inherit;color:var(--gray-900);background:var(--white);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo);}
  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B5D74' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:34px;}

  .addon-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);gap:10px;}
  .addon-row:last-child{border-bottom:none;}
  .addon-label{font-size:13.5px;font-weight:600;flex:1;}
  .addon-desc{font-size:11px;color:var(--gray-400);margin-top:2px;line-height:1.3;}
  .addon-price{font-size:13px;font-weight:700;color:var(--gray-600);white-space:nowrap;}
  .checkbox-wrap{display:flex;align-items:flex-start;gap:9px;}
  input[type=checkbox],input[type=radio]{width:19px;height:19px;accent-color:var(--indigo);flex-shrink:0;margin-top:1px;}

  .radio-group{display:flex;gap:8px;margin-top:6px;}
  .radio-opt{flex:1;border:1.5px solid var(--gray-200);border-radius:8px;padding:9px;display:flex;align-items:center;gap:7px;cursor:pointer;}
  .radio-opt.selected{border-color:var(--indigo);background:#EEF1FF;}
  .radio-opt span{font-size:12.5px;font-weight:600;}

  .subgroup{background:var(--gray-100);border-radius:8px;padding:10px 12px;margin-top:8px;}
  .subgroup .subtitle{font-size:11.5px;font-weight:800;color:var(--gray-600);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}

  .vehicle-card{border:1.5px solid var(--gray-200);border-radius:9px;padding:12px;margin-bottom:10px;position:relative;}
  .vehicle-card.approved{border-color:var(--green);background:#F2FBF6;}
  .vehicle-card .vtitle{font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;}
  .badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.04em;}
  .badge.approved{background:var(--green);color:var(--white);}
  .badge.draft{background:var(--gray-200);color:var(--gray-600);}
  .vehicle-meta{font-size:12px;color:var(--gray-600);margin-top:3px;}
  .vcard-actions{display:flex;gap:8px;margin-top:10px;}

  button{font-family:inherit;cursor:pointer;border:none;}
  .btn{padding:12px 14px;border-radius:8px;font-weight:700;font-size:13.5px;}
  .btn-primary{background:var(--indigo);color:var(--white);width:100%;}
  .btn-secondary{background:var(--white);color:var(--navy);border:1.5px solid var(--navy);}
  .btn-outline{background:var(--white);color:var(--gray-600);border:1.5px solid var(--gray-200);}
  .btn-danger-outline{background:var(--white);color:var(--red);border:1.5px solid #F3C7C7;}
  .btn-sm{padding:8px 10px;font-size:12px;flex:1;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .fleet-progress{display:flex;align-items:center;justify-content:space-between;background:var(--gray-100);border-radius:8px;padding:12px;margin-bottom:12px;}
  .fleet-progress .count{font-size:22px;font-weight:800;color:var(--navy);}
  .fleet-progress .count small{font-size:12px;font-weight:600;color:var(--gray-600);}
  .warn-banner{background:#FFF6E5;border:1px solid #F4D999;color:#8A6200;font-size:12px;font-weight:600;padding:10px 12px;border-radius:8px;margin-bottom:12px;line-height:1.4;}
  .info-banner{background:#EEF1FF;border:1px solid #C9D1FF;color:var(--navy);font-size:12px;font-weight:600;padding:10px 12px;border-radius:8px;margin-bottom:12px;line-height:1.4;}

  .totals-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;}
  .totals-row.total{border-top:1.5px solid var(--gray-200);margin-top:6px;padding-top:10px;font-size:17px;font-weight:800;color:var(--navy);}
  .totals-row .label{color:var(--gray-600);font-weight:600;}
  .totals-row.total .label{color:var(--navy);}

  .exempt-note{font-size:11.5px;color:var(--gray-600);margin-top:6px;line-height:1.4;}

  .footer-actions{position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--gray-200);padding:12px 16px;display:flex;gap:8px;max-width:480px;margin:0 auto;}

  .saved-item{padding:10px 0;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .saved-item:last-child{border-bottom:none;}
  .saved-item .si-name{font-weight:700;font-size:13.5px;}
  .saved-item .si-meta{font-size:11.5px;color:var(--gray-600);margin-top:2px;}
  .saved-item .si-total{font-weight:800;color:var(--navy);font-size:14px;}

  .empty-state{text-align:center;padding:20px 10px;color:var(--gray-400);font-size:13px;font-weight:600;}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.2);}
</style>
</head>

/* ============ CALCULATIONS ============ */
function calcIndividualLines(){
  const vt = state.individual.vehicleType;
  const svcKey = state.individual.service;
  const svc = INDIVIDUAL_SERVICES[svcKey];
  const lines = [{key:svcKey, label:L(svc.label), vehicle:L(VEHICLE_TYPE_LABELS)[vt], amount:svc.prices[vt], includes:L(svc.includes)}];
  Object.keys(state.individual.addons).forEach(key=>{
    if(state.individual.addons[key]){
      const a = ADDONS[key];
      lines.push({key, label:L(a.label), vehicle:L(VEHICLE_TYPE_LABELS)[vt], amount:a.prices[vt], desc:L(a.desc)});
    }
  });
  const subtotal = lines.reduce((s,l)=> s + (l.amount||0), 0);
  return {lines, subtotal};
}

function calcFleetLines(){
  const approved = state.fleet.vehicles.filter(v=>v.approved);
  let lines = [];
  let fleetDiscount = 0;
  approved.forEach((v,idx)=>{
    const svc = FLEET_SERVICES[v.service];
    const vLabel = L(VEHICLE_TYPE_LABELS)[v.type] + ' #' + (idx+1) + (v.makeModel?(' — '+v.makeModel):'');
    lines.push({key:v.service, label:L(svc.label), vehicle:vLabel, amount:svc.prices[v.type], includes:L(svc.includes)});
    Object.keys(v.addons).forEach(key=>{
      if(v.addons[key]){
        const a = ADDONS[key];
        const full = a.prices[v.type];
        lines.push({key, label:L(a.label), vehicle:vLabel, amount:full, desc:L(a.desc)});
        fleetDiscount += FLEET_ADDON_DISCOUNT;
      }
    });
  });
  const rawSubtotal = lines.reduce((s,l)=> s + (l.amount||0), 0);
  return {lines, approvedCount:approved.length, totalCount:state.fleet.vehicles.length, fleetDiscount, subtotal: rawSubtotal - fleetDiscount};
}

function calcTotals(){
  let base;
  if(state.quoteType === 'individual') base = calcIndividualLines();
  else if(state.quoteType === 'fleet') base = calcFleetLines();
  else base = {lines:[{key:'boat', label:t('boat'), vehicle:'—', amount:null}], subtotal:0, fleetDiscount:0};

  const subtotal = base.subtotal || 0;
  const discount = Number(state.discount) || 0;
  const afterDiscount = Math.max(0, subtotal - discount);
  const rate = (state.tax.exempt || !state.tax.include) ? 0 : FIXED_TAX_RATE;
  const tax = afterDiscount * (rate/100);
  const total = afterDiscount + tax;
  return {...base, subtotal, discount, tax, taxRate:rate, total};
}

function uniqueIncludesBlocks(lines){
  const seen = {}; const blocks = [];
  lines.forEach(l=>{
    if(l.includes && !seen[l.key]){ seen[l.key]=true; blocks.push({label:l.label, includes:l.includes}); }
  });
  return blocks;
}

/* ============ EVENTS ============ */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=> el.addEventListener('click', onAction));
  const bind = (id, evt, fn) => { const el = document.getElementById(id); if(el) el.addEventListener(evt, fn); };
  bind('cust-name','input', e=>{ state.customer.name = e.target.value; });
  bind('cust-contact','input', e=>{ state.customer.contact = e.target.value; });
  bind('cust-address','input', e=>{ state.customer.address = e.target.value; });
  bind('cust-makemodel','input', e=>{ state.customer.makeModel = e.target.value; });
  bind('ind-vtype','change', e=>{ state.individual.vehicleType = Number(e.target.value); render(); });
  bind('ind-service','change', e=>{ state.individual.service = e.target.value; render(); });
  bind('fv-type','change', e=>{ state.activeVehicleDraft.type = Number(e.target.value); render(); });
  bind('fv-makemodel','input', e=>{ state.activeVehicleDraft.makeModel = e.target.value; });
  bind('fv-service','change', e=>{ state.activeVehicleDraft.service = e.target.value; render(); });
  bind('tax-include','change', e=>{ state.tax.include = e.target.checked; render(); });
  bind('tax-exempt','change', e=>{ state.tax.exempt = e.target.checked; render(); });
  bind('manual-discount','input', e=>{ state.discount = e.target.value; render(); });
  bind('ov-active','change', e=>{ state.fleet.override.active = e.target.checked; render(); });
  bind('ov-name','input', e=>{ state.fleet.override.name = e.target.value; updateOverrideBannerText(); });
  bind('ov-reason','input', e=>{ state.fleet.override.reason = e.target.value; updateOverrideBannerText(); });

  document.querySelectorAll('[data-action="toggle-addon"]').forEach(el=>{
    el.addEventListener('change', e=>{
      const key = e.target.getAttribute('data-key');
      const target = state.activeVehicleDraft ? state.activeVehicleDraft.addons : state.individual.addons;
      target[key] = e.target.checked;
      render();
    });
  });
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.getAttribute('data-action');
  if(action === 'set-lang'){ state.lang = el.getAttribute('data-value'); render(); }
  else if(action === 'set-author'){ state.createdBy = el.getAttribute('data-value'); render(); }
  else if(action === 'set-type'){ state.quoteType = el.getAttribute('data-value'); render(); }
  else if(action === 'set-radio-addon'){
    const group = el.getAttribute('data-group');
    const value = el.getAttribute('data-value');
    const target = state.activeVehicleDraft ? state.activeVehicleDraft.addons : state.individual.addons;
    target[group+'_wash'] = false; target[group+'_decon'] = false;
    target[group+'_'+value] = true;
    render();
  }
  else if(action === 'start-vehicle-draft'){ state.activeVehicleDraft = emptyVehicleDraft(); render(); }
  else if(action === 'cancel-vehicle-draft'){ state.activeVehicleDraft = null; render(); }
  else if(action === 'confirm-vehicle-draft'){
    const d = state.activeVehicleDraft; d.approved = true;
    state.fleet.vehicles.push(d); state.activeVehicleDraft = null; render();
  }
  else if(action === 'approve-vehicle'){
    const v = state.fleet.vehicles.find(v=>v.id===el.getAttribute('data-id'));
    if(v) v.approved = true; render();
  }
  else if(action === 'remove-vehicle'){
    state.fleet.vehicles = state.fleet.vehicles.filter(v=>v.id!==el.getAttribute('data-id')); render();
  }
  else if(action === 'open-saved'){
    const q = savedQuotes.find(q=>q.id===el.getAttribute('data-id'));
    if(q && confirm(t('confirmLoad'))){
      const lang = state.lang;
      state = JSON.parse(JSON.stringify(q.state));
      state.lang = lang;
      editingSavedId = q.id; render();
    }
  }
}

/* ============ VALIDATION ============ */
function canFinalize(){
  if(state.quoteType !== 'fleet') return true;
  const approvedCount = state.fleet.vehicles.filter(v=>v.approved).length;
  if(approvedCount >= FLEET_MIN_VEHICLES) return true;
  if(state.fleet.override.active && state.fleet.override.name.trim() && state.fleet.override.reason.trim()) return true;
  return false;
}

/* ============ SAVE ============ */
async function handleSave(){
  if(!state.createdBy){ alert(t('selectAuthorFirst')); return; }
  const tt = calcTotals();
  const record = {
    id: editingSavedId || newId(), createdBy: state.createdBy, quoteType: state.quoteType,
    customer: state.customer, total: tt.total, savedAt: new Date().toISOString(),
    state: JSON.parse(JSON.stringify(state)),
  };
  const idx = savedQuotes.findIndex(q=>q.id===record.id);
  if(idx>=0) savedQuotes[idx] = record; else savedQuotes.push(record);
  await persistSavedQuotes();
  editingSavedId = record.id; render();
  showToast(t('quoteSaved'));
}

/* ============ PDF GENERATION (jsPDF) ============ */
function generatePdfDoc(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const pageWidth = doc.internal.pageSize.getWidth();
  const navy = [1,3,62], indigo=[0,51,255], gray=[91,93,116], grayLight=[228,229,238];
  const tt = calcTotals();
  const today = new Date().toLocaleDateString(state.lang==='es'?'es-MX':'en-US');

  // header
  doc.setFillColor(...navy); doc.rect(0,0,pageWidth,86,'F');
  doc.setFillColor(...indigo); doc.rect(0,86,pageWidth,4,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text(t('pvTag').toUpperCase(), 40, 30);
  doc.setFontSize(20);
  doc.text('Aquaman Services', 40, 54);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(t('pvTagline'), 40, 72);

  // customer / date block
  let y = 116;
  doc.setTextColor(...gray); doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.text(t('preparedFor').toUpperCase(), 40, y);
  doc.text(t('date').toUpperCase(), pageWidth-160, y);
  doc.setTextColor(20,20,40); doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  doc.text(state.customer.name || '—', 40, y+16);
  doc.text(today, pageWidth-160, y+16);
  let y2 = y+16;
  if(state.customer.contact){ y2+=14; doc.text(state.customer.contact, 40, y2); }
  if(state.customer.address){ y2+=14; doc.text(state.customer.address, 40, y2); }
  if(state.customer.makeModel){ y2+=14; doc.text(state.customer.makeModel, 40, y2); }
  doc.setTextColor(...gray); doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.text(t('preparedBy').toUpperCase(), pageWidth-160, y+32);
  doc.setTextColor(20,20,40); doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  doc.text((AUTHOR_FULL_NAME[state.createdBy]||state.createdBy||'—') + ' · Aquaman Services', pageWidth-160, y+48);

  let curY = Math.max(y2, y+64) + 20;

  if(state.quoteType === 'boat'){
    doc.setFontSize(11); doc.setTextColor(20,20,40);
    doc.text(doc.splitTextToSize(t('boatContact'), pageWidth-80), 40, curY);
    curY += 40;
  } else {
    const rows = tt.lines.map(l => [
      l.desc ? (l.label + '\n' + l.desc) : l.label,
      l.vehicle,
      l.amount!=null ? money(l.amount) : ''
    ]);
    doc.autoTable({
      startY: curY,
      head: [[t('serviceAddon'), t('vehicle'), t('amount')]],
      body: rows,
      theme: 'plain',
      margin:{left:40,right:40},
      styles:{font:'helvetica', fontSize:9.5, cellPadding:{top:6,bottom:6,left:0,right:6}, textColor:[20,20,40]},
      headStyles:{textColor:gray, fontStyle:'bold', fontSize:8, lineWidth:{bottom:1}, lineColor:grayLight},
      columnStyles:{0:{cellWidth:280},1:{cellWidth:150},2:{cellWidth:'auto', halign:'right', fontStyle:'bold'}},
      didParseCell: function(data){
        if(data.row.section==='body' && data.column.index===0){
          data.cell.styles.fontStyle = 'normal';
        }
      },
    });
    curY = doc.lastAutoTable.finalY + 16;

    // Summary
    const summaryX = pageWidth - 220;
    doc.setDrawColor(...grayLight); doc.line(summaryX, curY, pageWidth-40, curY);
    curY += 14;
    const sumRow = (label, val, bold)=>{
      doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(bold?12:10);
      doc.setTextColor(bold?navy[0]:gray[0], bold?navy[1]:gray[1], bold?navy[2]:gray[2]);
      doc.text(label, summaryX, curY);
      doc.setTextColor(20,20,40);
      doc.text(val, pageWidth-40, curY, {align:'right'});
      curY += bold?20:16;
    };
    sumRow(t('subtotal'), money(tt.subtotal));
    if(state.quoteType==='fleet' && tt.fleetDiscount) sumRow(t('fleetDiscount'), '-'+money(tt.fleetDiscount));
    if(tt.discount) sumRow(t('discount'), '-'+money(tt.discount));
    sumRow(t('salesTax') + (state.tax.exempt?' '+t('exemptResale'):''), money(tt.tax));
    doc.setDrawColor(...grayLight); doc.line(summaryX, curY-4, pageWidth-40, curY-4);
    curY += 6;
    sumRow(t('total'), money(tt.total), true);
    curY += 10;

    // What's included
    const blocks = uniqueIncludesBlocks(tt.lines);
    if(blocks.length){
      curY += 10;
      blocks.forEach(b=>{
        if(curY > 680){ doc.addPage(); curY = 50; }
        doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...navy);
        doc.text(t('whatsIncluded') + ' — ' + b.label, 40, curY);
        curY += 14;
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(60,60,80);
        b.includes.forEach(inc=>{
          const wrapped = doc.splitTextToSize('•  ' + inc, pageWidth-90);
          if(curY > 700){ doc.addPage(); curY = 50; }
          doc.text(wrapped, 46, curY);
          curY += wrapped.length*12 + 3;
        });
        curY += 8;
      });
    }
  }

  // footer
  if(curY > 730){ doc.addPage(); curY = 60; }
  doc.setDrawColor(...grayLight); doc.line(40, curY, pageWidth-40, curY);
  curY += 16;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...gray);
  doc.text(doc.splitTextToSize(t('footnote'), pageWidth-80), 40, curY);
  curY += 24;
  doc.text('(901) 340-9733', 40, curY);

  return doc;
}

function pdfFilename(){
  const name = (state.customer.name || 'estimate').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  return `aquaman-estimate-${name}.pdf`;
}

/* ============ PDF BUTTON (download) ============ */
function handlePrint(){
  if(!state.createdBy){ alert(t('selectAuthorFirst2')); return; }
  if(!canFinalize()){ alert(t('belowMinBlock')(FLEET_MIN_VEHICLES)); return; }
  const doc = generatePdfDoc();
  doc.save(pdfFilename());
}

/* ============ EMAIL (native share with attached PDF, fallback to mailto) ============ */
function buildEmailContent(){
  const subject = t('emailSubject');
  const bodyLines = [
    t('emailGreeting')(state.customer.name),
    '',
    t('emailBody1'),
    '',
    t('emailBody2'),
    '',
    t('emailClosing'),
    'Aquaman Services',
    '(901) 340-9733',
  ];
  return {subject, body: bodyLines.join('\n')};
}

async function handleEmail(){
  if(!state.createdBy){ alert(t('selectAuthorFirst2')); return; }
  if(!canFinalize()){ alert(t('belowMinBlock')(FLEET_MIN_VEHICLES)); return; }

  const doc = generatePdfDoc();
  const blob = doc.output('blob');
  const filename = pdfFilename();
  const {subject, body} = buildEmailContent();

  let shared = false;
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:t('pdfShareTitle'), text: subject + '\n\n' + body});
      shared = true;
    }
  }catch(err){
    if(err && err.name === 'AbortError'){ shared = true; } // user cancelled share sheet, don't fall back
  }

  if(!shared){
    doc.save(filename);
    const bodyWithNote = body + '\n\n' + t('emailNoAttachNote');
    const mailto = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(bodyWithNote);
    window.location.href = mailto;
  }
}

/* ============ INIT ============ */
document.getElementById('btn-save').addEventListener('click', handleSave);
document.getElementById('btn-print').addEventListener('click', handlePrint);
document.getElementById('btn-email').addEventListener('click', handleEmail);

(async function init(){
  await loadSavedQuotes();
  render();
})();
</script>
